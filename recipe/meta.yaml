{% set name = "scp" %}
{% set version = "0.16.1" %}

# Tests are disabled, need to setup the SSH server.
# https://github.com/jbardin/scp.py/blob/master/.ci/setup_ssh.sh
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3f2b260bf9bd4c2b6857f697a1d7e8edc26fa569282b77027e849dfe1e48580a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    - paramiko

test:
  imports:
    - scp
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/jbardin/scp.py.git
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  license_family: LGPL
  description: |
    The scp.py module uses a paramiko transport to send and receive files via the scp1 protocol.
    This is the protocol as referenced from the openssh scp program, and has only been tested with this implementation.
  dev_url: https://github.com/jbardin/scp.py
  doc_url: https://github.com/jbardin/scp.py/blob/master/README.rst
  summary: Pure python scp module for paramiko

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
