{% set version = "0.14.3" %}

package:
  name: scp
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/s/scp/scp-{{ version }}.tar.gz
  sha256: 2d0349a540081dd246c8141e45699f3f863f2d53acc084abd07d3e387a31e5c7

build:
  number: 0
  noarch: python
  # there are missing dependencies for s390x
  skip: True  # [py<37 or s390x]
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - paramiko

test:
  imports:
    - scp
  requires:
    - pip
    - python <3.10
  commands:
    - pip check

about:
  home: https://github.com/jbardin/scp.py.git
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  license_family: LGPL
  dev_url: https://github.com/jbardin/scp.py
  doc_url: https://github.com/jbardin/scp.py/blob/master/README.rst
  summary: Pure python scp module for paramiko

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
